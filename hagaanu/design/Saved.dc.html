<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Assistant:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #14161C; font-family: 'Assistant', system-ui, sans-serif; }
    a { color: #FF6B1A; } a:hover { color: #E05A0F; }
  </style>
</helmet>

<div dir="rtl" style="width: 390px; height: 844px; background: #14161C; position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 26px 20px 30px; gap: 26px;">

  <div style="position: absolute; top: 0; right: 0; left: 0; height: 4px; background: #FF6B1A;"></div>

  <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 22px;">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.2em; color: #6B7280;">SAVED · 04</span>
    <h1 style="margin: 0; font-family: 'Heebo', sans-serif; font-weight: 900; font-size: 38px; line-height: 1.04; letter-spacing: -0.04em; color: #F2EDE4;">יעדים שמורים</h1>
    <p style="margin: 2px 0 0; font-size: 15px; font-weight: 600; color: #6B7280;">הקשה אחת מפעילה את ההתראה.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px;">

    <!-- בית -->
    <div style="position: relative; background: #F2EDE4; height: 82px; display: flex; align-items: center; gap: 16px; padding: 0 18px 0 20px; overflow: hidden;">
      <div style="position: absolute; top: 50%; right: -11px; width: 22px; height: 22px; border-radius: 50%; background: #14161C; transform: translateY(-50%);"></div>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="flex: none;" aria-hidden="true">
        <path d="M4 10.2 12 4l8 6.2V19a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-8.8Z" stroke="#14161C" stroke-width="1.9" stroke-linejoin="round"></path>
        <path d="M9.5 20v-6h5v6" stroke="#14161C" stroke-width="1.9" stroke-linejoin="round"></path>
      </svg>
      <div style="width: 1px; align-self: stretch; margin: 18px 0; background: repeating-linear-gradient(#C9C1B2 0 3px, transparent 3px 7px); flex: none;"></div>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
        <span style="font-family: 'Heebo', sans-serif; font-weight: 800; font-size: 19px; letter-spacing: -0.025em; color: #14161C;">בית</span>
        <span style="font-size: 13px; font-weight: 600; color: #8C8478; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">הרצל 88, כפר סבא</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 1px; flex: none;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 500; color: #14161C; font-variant-numeric: tabular-nums;">500</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.12em; color: #A79E8E;">M</span>
      </div>
    </div>

    <!-- עבודה -->
    <div style="position: relative; background: #F2EDE4; height: 82px; display: flex; align-items: center; gap: 16px; padding: 0 18px 0 20px; overflow: hidden;">
      <div style="position: absolute; top: 50%; right: -11px; width: 22px; height: 22px; border-radius: 50%; background: #14161C; transform: translateY(-50%);"></div>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="flex: none;" aria-hidden="true">
        <rect x="3.5" y="7.5" width="17" height="12.5" rx="1.5" stroke="#14161C" stroke-width="1.9"></rect>
        <path d="M9 7.5V6a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 6v1.5" stroke="#14161C" stroke-width="1.9" stroke-linecap="round"></path>
        <path d="M3.5 12.5h17" stroke="#14161C" stroke-width="1.9"></path>
      </svg>
      <div style="width: 1px; align-self: stretch; margin: 18px 0; background: repeating-linear-gradient(#C9C1B2 0 3px, transparent 3px 7px); flex: none;"></div>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
        <span style="font-family: 'Heebo', sans-serif; font-weight: 800; font-size: 19px; letter-spacing: -0.025em; color: #14161C;">עבודה</span>
        <span style="font-size: 13px; font-weight: 600; color: #8C8478; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">תחנת השלום, תל אביב</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 1px; flex: none;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 500; color: #14161C; font-variant-numeric: tabular-nums;">500</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.12em; color: #A79E8E;">M</span>
      </div>
    </div>

    <!-- תחנת רכבת -->
    <div style="position: relative; background: #F2EDE4; height: 82px; display: flex; align-items: center; gap: 16px; padding: 0 18px 0 20px; overflow: hidden;">
      <div style="position: absolute; top: 50%; right: -11px; width: 22px; height: 22px; border-radius: 50%; background: #14161C; transform: translateY(-50%);"></div>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="flex: none;" aria-hidden="true">
        <rect x="5" y="3.5" width="14" height="13.5" rx="2.5" stroke="#14161C" stroke-width="1.9"></rect>
        <path d="M5 10.5h14" stroke="#14161C" stroke-width="1.9"></path>
        <path d="M8.5 17 6 20.5M15.5 17l2.5 3.5" stroke="#14161C" stroke-width="1.9" stroke-linecap="round"></path>
        <circle cx="9" cy="14" r="1.1" fill="#14161C"></circle>
        <circle cx="15" cy="14" r="1.1" fill="#14161C"></circle>
      </svg>
      <div style="width: 1px; align-self: stretch; margin: 18px 0; background: repeating-linear-gradient(#C9C1B2 0 3px, transparent 3px 7px); flex: none;"></div>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
        <span style="font-family: 'Heebo', sans-serif; font-weight: 800; font-size: 19px; letter-spacing: -0.025em; color: #14161C;">בנימינה</span>
        <span style="font-size: 13px; font-weight: 600; color: #8C8478; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">תחנת רכבת בנימינה</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 1px; flex: none;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 500; color: #14161C; font-variant-numeric: tabular-nums;">1000</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.12em; color: #A79E8E;">M</span>
      </div>
    </div>

    <!-- מועדף -->
    <div style="position: relative; background: #F2EDE4; height: 82px; display: flex; align-items: center; gap: 16px; padding: 0 18px 0 20px; overflow: hidden;">
      <div style="position: absolute; top: 50%; right: -11px; width: 22px; height: 22px; border-radius: 50%; background: #14161C; transform: translateY(-50%);"></div>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="flex: none;" aria-hidden="true">
        <path d="m12 4 2.45 5.2 5.55.8-4 4.05.95 5.75L12 17.1 7.05 19.8 8 14.05l-4-4.05 5.55-.8L12 4Z" stroke="#14161C" stroke-width="1.9" stroke-linejoin="round"></path>
      </svg>
      <div style="width: 1px; align-self: stretch; margin: 18px 0; background: repeating-linear-gradient(#C9C1B2 0 3px, transparent 3px 7px); flex: none;"></div>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
        <span style="font-family: 'Heebo', sans-serif; font-weight: 800; font-size: 19px; letter-spacing: -0.025em; color: #14161C;">אמא</span>
        <span style="font-size: 13px; font-weight: 600; color: #8C8478; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">ויצמן 12, חיפה</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 1px; flex: none;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 500; color: #14161C; font-variant-numeric: tabular-nums;">300</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.12em; color: #A79E8E;">M</span>
      </div>
    </div>

    <!-- add -->
    <button type="button" style="height: 62px; border: 1.5px dashed #3D4351; background: none; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 5v14M5 12h14" stroke="#FF6B1A" stroke-width="2.2" stroke-linecap="round"></path>
      </svg>
      <span style="font-family: 'Assistant', sans-serif; font-size: 15px; font-weight: 700; color: #9AA1AE;">הוספת יעד</span>
    </button>
  </div>
</div>
</x-dc>
</body>
</html>
