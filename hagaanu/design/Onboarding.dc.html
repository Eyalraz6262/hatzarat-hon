<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Assistant:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #14161C; font-family: 'Assistant', system-ui, sans-serif; }
    a { color: #FF6B1A; } a:hover { color: #E05A0F; }
  </style>
</helmet>

<div dir="rtl" style="width: 390px; height: 844px; background: #14161C; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 72px 28px 40px;">

  <!-- signage rule: the orange hairline that runs across every screen's header -->
  <div style="position: absolute; top: 0; right: 0; left: 0; height: 4px; background: #FF6B1A;"></div>

  <!-- faint tick ruler down the right edge, like a platform edge marking -->
  <div style="position: absolute; top: 120px; right: 0; width: 12px; height: 420px; display: flex; flex-direction: column; justify-content: space-between;">
    <div style="height: 1px; background: #2A2E3A;"></div>
    <div style="height: 1px; background: #2A2E3A;"></div>
    <div style="height: 1px; background: #2A2E3A;"></div>
    <div style="height: 1px; background: #2A2E3A;"></div>
    <div style="height: 1px; background: #2A2E3A;"></div>
    <div style="height: 1px; background: #2A2E3A;"></div>
    <div style="height: 1px; background: #2A2E3A;"></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 34px;">

    <!-- step counter set like a platform indicator -->
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.12em; color: #FF6B1A;">03</span>
      <div style="width: 26px; height: 1px; background: #2A2E3A;"></div>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 400; letter-spacing: 0.12em; color: #6B7280;">03</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 400; letter-spacing: 0.18em; color: #6B7280; margin-inline-start: 6px;">PERMISSIONS</span>
    </div>

    <!-- the mark: a crescent cradling a station node -->
    <svg width="76" height="76" viewBox="0 0 76 76" fill="none" aria-hidden="true">
      <path d="M52 14a26 26 0 1 0 0 48 31 31 0 0 1 0-48Z" fill="#FF6B1A"></path>
      <circle cx="52" cy="38" r="9.5" stroke="#F2EDE4" stroke-width="2.5"></circle>
      <circle cx="52" cy="38" r="3.25" fill="#F2EDE4"></circle>
    </svg>

    <div style="display: flex; flex-direction: column; gap: 18px;">
      <h1 style="margin: 0; font-family: 'Heebo', system-ui, sans-serif; font-weight: 900; font-size: 46px; line-height: 1.02; letter-spacing: -0.035em; color: #F2EDE4; text-wrap: balance;">גם כשהמסך<br>כבוי</h1>

      <p style="margin: 0; font-size: 16px; line-height: 1.62; color: #9AA1AE; max-width: 31ch;">כדי להעיר אתכם לפני התחנה, ״הגענו?״ צריכה לזהות מתי אתם מתקרבים ליעד גם כשהמסך כבוי והטלפון בכיס.</p>

      <!-- the operative instruction, promoted onto a paper strip so it cannot be skimmed past -->
      <div style="display: flex; gap: 12px; align-items: flex-start; background: #1C1F28; border-inline-start: 3px solid #FF6B1A; padding: 14px 16px;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; color: #FF6B1A; letter-spacing: 0.1em; padding-top: 2px;">!</span>
        <p style="margin: 0; font-size: 14px; line-height: 1.55; color: #F2EDE4;">במסך הבא בחרו <strong style="font-weight: 700;">״תמיד״</strong>. זה מה שמאפשר לנו להעיר אתכם כשהטלפון נעול.</p>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px;">
    <button type="button" style="height: 58px; border: none; background: #FF6B1A; color: #14161C; font-family: 'Heebo', system-ui, sans-serif; font-size: 18px; font-weight: 800; letter-spacing: -0.01em; cursor: pointer;">אפשר גישה ברקע</button>
    <button type="button" style="height: 48px; border: none; background: none; color: #6B7280; font-family: 'Assistant', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer;">לא עכשיו</button>

    <div style="display: flex; align-items: center; justify-content: center; gap: 9px; padding-top: 10px;">
      <div style="width: 5px; height: 5px; background: #FF6B1A;"></div>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.16em; color: #6B7280;">תישן. אנחנו נעיר אותך.</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
