<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Assistant:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #14161C; font-family: 'Assistant', system-ui, sans-serif; }
    a { color: #FF6B1A; } a:hover { color: #E05A0F; }
  </style>
</helmet>

<div dir="rtl" style="width: 390px; height: 844px; background: #14161C; position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <!-- ============ stub: who is travelling, and on what ============ -->
  <div style="background: #F2EDE4; padding: 30px 24px 20px; display: flex; align-items: center; gap: 11px;">
    <div style="width: 28px; height: 28px; background: #FF6B1A; display: flex; align-items: center; justify-content: center;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="7" stroke="#14161C" stroke-width="2.4"></circle>
        <circle cx="12" cy="12" r="2.4" fill="#14161C"></circle>
      </svg>
    </div>
    <span style="font-family: 'Heebo', sans-serif; font-weight: 900; font-size: 21px; letter-spacing: -0.04em; color: #14161C;">הגענו?</span>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.18em; color: #A79E8E; margin-inline-start: auto;">WAKE PASS</span>
  </div>

  <!-- perforation -->
  <div style="position: relative; height: 2px; background: #F2EDE4;">
    <div style="position: absolute; top: -13px; right: -13px; width: 26px; height: 26px; border-radius: 50%; background: #14161C;"></div>
    <div style="position: absolute; top: -13px; left: -13px; width: 26px; height: 26px; border-radius: 50%; background: #14161C;"></div>
    <div style="position: absolute; top: 0; right: 18px; left: 18px; height: 2px; background: repeating-linear-gradient(to left, #C9C1B2 0 6px, transparent 6px 13px);"></div>
  </div>

  <!-- ============ the promise ============ -->
  <div style="position: relative; flex-grow: 1; background: #F2EDE4; padding: 40px 24px 0; overflow: hidden;">

    <!-- watermark crescent, the way a real ticket carries a security mark -->
    <svg width="300" height="300" viewBox="0 0 76 76" fill="none" style="position: absolute; top: 24px; left: -78px;" aria-hidden="true">
      <path d="M52 14a26 26 0 1 0 0 48 31 31 0 0 1 0-48Z" fill="#E6DFD1"></path>
    </svg>

    <div style="position: relative; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 9px;">
        <div style="width: 9px; height: 9px; border-radius: 50%; background: #FF6B1A;"></div>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.16em; color: #14161C;">ההתראה פעילה</span>
      </div>

      <h1 style="margin: 0; font-family: 'Heebo', sans-serif; font-weight: 900; font-size: 62px; line-height: 0.94; letter-spacing: -0.05em; color: #14161C;">אפשר<br>לישון</h1>

      <p style="margin: 6px 0 0; font-size: 17px; font-weight: 600; color: #6B7280;">אנחנו נעיר אותך לפני היעד.</p>
    </div>

    <!-- departures-board data, with the dotted leaders of a printed timetable -->
    <div style="position: relative; display: flex; flex-direction: column; gap: 2px; margin-top: 38px;">
      <div style="display: flex; align-items: baseline; gap: 8px; padding: 11px 0;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em; color: #A79E8E; flex: none;">יעד</span>
        <div style="flex-grow: 1; height: 1px; background: repeating-linear-gradient(to left, #C9C1B2 0 1px, transparent 1px 5px); transform: translateY(-3px);"></div>
        <span style="font-family: 'Heebo', sans-serif; font-size: 17px; font-weight: 800; letter-spacing: -0.02em; color: #14161C; flex: none;">תחנת השלום</span>
      </div>

      <div style="display: flex; align-items: baseline; gap: 8px; padding: 11px 0; border-top: 1px solid #E0D9CB;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em; color: #A79E8E; flex: none;">מרחק נוכחי</span>
        <div style="flex-grow: 1; height: 1px; background: repeating-linear-gradient(to left, #C9C1B2 0 1px, transparent 1px 5px); transform: translateY(-3px);"></div>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 500; color: #14161C; font-variant-numeric: tabular-nums; flex: none;">4.2<span style="font-family: 'Assistant', sans-serif; font-size: 13px; font-weight: 700; color: #6B7280; margin-inline-start: 4px;">ק״מ</span></span>
      </div>

      <div style="display: flex; align-items: baseline; gap: 8px; padding: 11px 0; border-top: 1px solid #E0D9CB;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em; color: #A79E8E; flex: none;">התראה בטווח</span>
        <div style="flex-grow: 1; height: 1px; background: repeating-linear-gradient(to left, #C9C1B2 0 1px, transparent 1px 5px); transform: translateY(-3px);"></div>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 500; color: #FF6B1A; font-variant-numeric: tabular-nums; flex: none;">500<span style="font-family: 'Assistant', sans-serif; font-size: 13px; font-weight: 700; margin-inline-start: 4px;">מ׳</span></span>
      </div>
    </div>
  </div>

  <!-- ============ foot: code and the one way out ============ -->
  <div style="background: #F2EDE4; padding: 22px 24px 30px; display: flex; flex-direction: column; gap: 18px;">
    <div style="display: flex; align-items: flex-end; gap: 14px;">
      <svg width="176" height="38" viewBox="0 0 176 38" fill="#14161C" aria-hidden="true">
        <rect x="0" y="0" width="3" height="38"></rect><rect x="5" y="0" width="1" height="38"></rect>
        <rect x="9" y="0" width="2" height="38"></rect><rect x="14" y="0" width="4" height="38"></rect>
        <rect x="21" y="0" width="1" height="38"></rect><rect x="25" y="0" width="3" height="38"></rect>
        <rect x="31" y="0" width="1" height="38"></rect><rect x="35" y="0" width="2" height="38"></rect>
        <rect x="40" y="0" width="4" height="38"></rect><rect x="47" y="0" width="2" height="38"></rect>
        <rect x="52" y="0" width="1" height="38"></rect><rect x="56" y="0" width="3" height="38"></rect>
        <rect x="62" y="0" width="2" height="38"></rect><rect x="67" y="0" width="1" height="38"></rect>
        <rect x="71" y="0" width="4" height="38"></rect><rect x="78" y="0" width="1" height="38"></rect>
        <rect x="82" y="0" width="2" height="38"></rect><rect x="87" y="0" width="3" height="38"></rect>
        <rect x="93" y="0" width="1" height="38"></rect><rect x="97" y="0" width="2" height="38"></rect>
        <rect x="102" y="0" width="4" height="38"></rect><rect x="109" y="0" width="1" height="38"></rect>
        <rect x="113" y="0" width="3" height="38"></rect><rect x="119" y="0" width="2" height="38"></rect>
        <rect x="124" y="0" width="1" height="38"></rect><rect x="128" y="0" width="4" height="38"></rect>
        <rect x="135" y="0" width="2" height="38"></rect><rect x="140" y="0" width="1" height="38"></rect>
        <rect x="144" y="0" width="3" height="38"></rect><rect x="150" y="0" width="1" height="38"></rect>
        <rect x="154" y="0" width="2" height="38"></rect><rect x="159" y="0" width="4" height="38"></rect>
        <rect x="166" y="0" width="1" height="38"></rect><rect x="170" y="0" width="3" height="38"></rect>
      </svg>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #A79E8E; margin-inline-start: auto; padding-bottom: 3px;">HGN·500·SHL</span>
    </div>

    <button type="button" style="height: 52px; border: 1.5px solid #14161C; background: none; color: #14161C; font-family: 'Assistant', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer;">בטל התראה</button>
  </div>
</div>
</x-dc>
</body>
</html>
